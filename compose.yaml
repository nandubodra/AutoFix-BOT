services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sitesentinel
      POSTGRES_USER: sitesentinel
      POSTGRES_PASSWORD: sitesentinel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/sitesentinel
      DB_USERNAME: sitesentinel
      DB_PASSWORD: sitesentinel
      SESSION_COOKIE_SECURE: "false"
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  pgdata:
