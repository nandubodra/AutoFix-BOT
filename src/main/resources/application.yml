spring:
  application:
    name: sitesentinel
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sitesentinel}
    username: ${DB_USERNAME:sitesentinel}
    password: ${DB_PASSWORD:sitesentinel}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  thymeleaf:
    cache: false
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

sitesentinel:
  monitoring:
    scheduler-delay-ms: ${MONITOR_SCHEDULER_DELAY_MS:5000}
    claim-seconds: ${MONITOR_CLAIM_SECONDS:60}
    thread-pool-size: ${MONITOR_THREAD_POOL_SIZE:4}
  http:
    max-redirects: ${HTTP_MAX_REDIRECTS:3}
    max-response-bytes: ${HTTP_MAX_RESPONSE_BYTES:1048576}
  security:
    login-window-seconds: ${LOGIN_WINDOW_SECONDS:300}
    max-login-attempts: ${MAX_LOGIN_ATTEMPTS:5}
  app-base-url: ${APP_BASE_URL:http://localhost:8080}
