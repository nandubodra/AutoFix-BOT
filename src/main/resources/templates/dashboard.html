<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - SiteSentinel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
<nav class="mb-4">
    <a class="btn btn-outline-primary" th:href="@{/websites}">Websites</a>
    <a class="btn btn-outline-primary" th:href="@{/incidents}">Incidents</a>
    <form method="post" th:action="@{/logout}" style="display:inline">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="btn btn-outline-secondary" type="submit">Logout</button>
    </form>
</nav>
<h1>Dashboard</h1>
<div class="row g-3 mb-4">
    <div class="col"><div class="card card-body">Total sites: <strong th:text="${totalSites}"></strong></div></div>
    <div class="col"><div class="card card-body">Healthy: <strong th:text="${healthySites}"></strong></div></div>
    <div class="col"><div class="card card-body">Incidents: <strong th:text="${incidentSites}"></strong></div></div>
    <div class="col"><div class="card card-body">Paused: <strong th:text="${pausedSites}"></strong></div></div>
</div>
<h2>Recent sites</h2>
<table class="table table-striped">
    <thead><tr><th>Name</th><th>URL</th><th>Status</th><th>Last check</th></tr></thead>
    <tbody>
    <tr th:each="site : ${sites}">
        <td><a th:href="@{|/websites/${site.id}|}" th:text="${site.name}"></a></td>
        <td th:text="${site.normalizedUrl}"></td>
        <td th:text="${site.status}"></td>
        <td th:text="${site.lastCheckAt}"></td>
    </tr>
    </tbody>
</table>
<h2>Failed alert deliveries</h2>
<table class="table table-sm">
    <thead><tr><th>Website</th><th>Type</th><th>Error</th><th>Attempts</th></tr></thead>
    <tbody>
    <tr th:each="delivery : ${failedAlerts}">
        <td th:text="${delivery.website.name}"></td>
        <td th:text="${delivery.alertType}"></td>
        <td th:text="${delivery.errorSummary}"></td>
        <td th:text="${delivery.attemptCount}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
