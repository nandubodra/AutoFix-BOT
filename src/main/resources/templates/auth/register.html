<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - SiteSentinel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-5">
<h1>Create account</h1>
<form method="post" th:action="@{/register}" th:object="${form}" class="mt-3">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <div class="mb-3">
        <label class="form-label">Email</label>
        <input class="form-control" th:field="*{email}">
        <div class="text-danger" th:errors="*{email}"></div>
    </div>
    <div class="mb-3">
        <label class="form-label">Password (12+ chars)</label>
        <input class="form-control" type="password" th:field="*{password}">
        <div class="text-danger" th:errors="*{password}"></div>
    </div>
    <button class="btn btn-primary" type="submit">Register</button>
    <a class="btn btn-link" th:href="@{/login}">Back to login</a>
</form>
</body>
</html>
