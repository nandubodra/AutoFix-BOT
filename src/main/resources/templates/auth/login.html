<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - SiteSentinel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-5">
<h1>SiteSentinel Login</h1>
<div class="alert alert-success" th:if="${param.registered}">Registration complete. Please log in.</div>
<div class="alert alert-danger" th:if="${param.error}">Invalid credentials.</div>
<div class="alert alert-warning" th:if="${param.blocked}">Too many login attempts. Try again later.</div>
<form method="post" th:action="@{/login}" class="mt-3">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <div class="mb-3">
        <label class="form-label">Email</label>
        <input class="form-control" type="email" name="username" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Password</label>
        <input class="form-control" type="password" name="password" required>
    </div>
    <button class="btn btn-primary" type="submit">Login</button>
    <a class="btn btn-link" th:href="@{/register}">Register</a>
</form>
</body>
</html>
