<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${website.name} + ' - SiteSentinel'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
<a class="btn btn-link" th:href="@{/websites}">← Websites</a>
<h1 th:text="${website.name}"></h1>
<p><strong>URL:</strong> <span th:text="${website.normalizedUrl}"></span></p>
<p><strong>Status:</strong> <span th:text="${website.status}"></span></p>
<p><strong>Verified:</strong> <span th:text="${website.verified}"></span></p>
<div class="alert alert-info">
    Verification token: <code th:text="${website.verificationToken}"></code><br>
    Publish it at <code>/.well-known/sitesentinel-verification/[token]</code> and click verify.
</div>
<form method="post" th:action="@{|/websites/${website.id}/verify|}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <button class="btn btn-primary" type="submit">Verify ownership</button>
</form>
<h2 class="mt-4">Recent checks</h2>
<table class="table table-sm table-striped">
    <thead><tr><th>Checked at</th><th>Success</th><th>Status</th><th>Duration</th><th>Failure</th></tr></thead>
    <tbody>
    <tr th:each="check : ${history}">
        <td th:text="${check.checkedAt}"></td>
        <td th:text="${check.success}"></td>
        <td th:text="${check.httpStatus}"></td>
        <td th:text="${check.durationMs}"></td>
        <td th:text="${check.failureCategory} + ': ' + ${check.failureSummary}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
