<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Incidents - SiteSentinel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
<a class="btn btn-link" th:href="@{/}">← Dashboard</a>
<h1>Incidents</h1>
<table class="table table-striped">
    <thead><tr><th>Website</th><th>Status</th><th>Severity</th><th>Last seen</th><th>Occurrences</th></tr></thead>
    <tbody>
    <tr th:each="incident : ${incidents.content}">
        <td><a th:href="@{|/incidents/${incident.id}|}" th:text="${incident.website.name}"></a></td>
        <td th:text="${incident.status}"></td>
        <td th:text="${incident.severity}"></td>
        <td th:text="${incident.lastSeenAt}"></td>
        <td th:text="${incident.occurrences}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
