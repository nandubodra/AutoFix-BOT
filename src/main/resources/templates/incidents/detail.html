<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Incident Detail - SiteSentinel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
<a class="btn btn-link" th:href="@{/incidents}">← Incidents</a>
<h1>Incident #<span th:text="${incident.id}"></span></h1>
<p><strong>Website:</strong> <span th:text="${incident.website.name}"></span></p>
<p><strong>Status:</strong> <span th:text="${incident.status}"></span></p>
<p><strong>Description:</strong> <span th:text="${incident.description}"></span></p>
<p><strong>First detected:</strong> <span th:text="${incident.firstDetectedAt}"></span></p>
<p><strong>Last seen:</strong> <span th:text="${incident.lastSeenAt}"></span></p>
<form method="post" th:if="${incident.status.name() == 'OPEN'}" th:action="@{|/incidents/${incident.id}/ack|}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <button class="btn btn-warning" type="submit">Acknowledge</button>
</form>
</body>
</html>
